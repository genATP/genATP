[package]
name = "genatp-cli"
description = "genATP command-line interface: serve / record / run / test / replay / install."
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "genatp"
path = "src/main.rs"

[lib]
name = "genatp_cli"
path = "src/lib.rs"

[dependencies]
clap = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
genatp-mcp = { path = "../genatp-mcp" }
genatp-browser = { path = "../genatp-browser" }
genatp-vault = { path = "../genatp-vault" }
genatp-cassette = { path = "../genatp-cassette" }
genatp-core = { path = "../genatp-core" }
chrono = { workspace = true }
directories = { workspace = true }
genatp-atp-spec = { path = "../genatp-atp-spec" }
genatp-debugger = { path = "../genatp-debugger" }
genatp-perception = { path = "../genatp-perception" }
genatp-registry = { path = "../genatp-registry" }
