[package]
name = "genatp-cassette"
description = "Action Cassettes: signed deterministic replay format, recorder, replay engine, self-heal. Phases 7–8."
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
blake3 = { workspace = true }
hex = { workspace = true }
zstd = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
directories = { workspace = true }
# Signing — ed25519-dalek is pure-Rust, audited, and the standard choice
# for ed25519 in the Rust ecosystem. Mirrors the vault's decision to avoid
# `ring` in favour of fewer audit surfaces (see workspace Cargo.toml notes).
ed25519-dalek = { workspace = true }
rand = { workspace = true }
base64 = { workspace = true }
url = { workspace = true }
# Cross-crate
genatp-core = { path = "../genatp-core" }
genatp-perception = { path = "../genatp-perception" }
genatp-llm = { path = "../genatp-llm" }
genatp-vault = { path = "../genatp-vault" }
# Async replay support
async-trait = { workspace = true }
tokio = { workspace = true, features = ["rt", "time"] }

[dev-dependencies]
tempfile = { workspace = true }
genatp-llm = { path = "../genatp-llm" }
genatp-browser = { path = "../genatp-browser" }
tokio = { workspace = true, features = ["rt", "macros", "time"] }
criterion = { workspace = true }
