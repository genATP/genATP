[package]
name = "genatp-mcp"
description = "Model Context Protocol server (stdio + HTTP transports). First public release surface. Phase 4."
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = ["http"]
# Enables the HTTP transport (axum). Disable for stdio-only embedded builds
# that don't need the extra binary size.
http = ["dep:axum", "dep:tower-http"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
chrono = { workspace = true }
base64 = { workspace = true }
url = { workspace = true }
genatp-browser = { path = "../genatp-browser" }
genatp-perception = { path = "../genatp-perception" }
genatp-core = { path = "../genatp-core" }
axum = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }
axum = { workspace = true }
reqwest = { workspace = true }
