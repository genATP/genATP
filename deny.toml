[graph]
# Audit all targets we ship.
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
]

[advisories]
# Separate from cargo-audit's default (~/.cargo/advisory-db). Both tools fetch
# RustSec advisories but initialize the directory differently; sharing one path
# breaks CI with "Refusing to initialize the non-empty directory".
db-path = "~/.cargo/deny-advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[licenses]
confidence-threshold = 0.8
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-DFS-2016",
  "Unicode-3.0",
  "Zlib",
  "MPL-2.0",
  "CC0-1.0",
  "CC-BY-4.0",
  "0BSD",
  "BSL-1.0",
  "OpenSSL",
  "LicenseRef-genATP-Personal-Use-1.0",
]
exceptions = []

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
