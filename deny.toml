[graph]
# Audit all targets we ship.
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
]

[advisories]
# Separate from cargo-audit's default (~/.cargo/advisory-db). Both tools fetch
# RustSec advisories but initialize the directory differently; sharing one path
# breaks CI with "Refusing to initialize the non-empty directory".
db-path = "~/.cargo/deny-advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path-only deps (intra-workspace) inherently can't be a wildcard supply-chain
# risk — they resolve to a local path, not a registry version. Without this,
# every `genatp-foo = { path = "../genatp-foo" }` line trips the wildcard ban.
allow-wildcard-paths = true
highlight = "all"

[licenses]
confidence-threshold = 0.8
# Keep this list **only** to licenses we actually encounter in the graph.
# cargo-deny emits a `license-not-encountered` warning for unused entries,
# so we treat the list as a living audit trail: every entry corresponds to
# at least one transitive dependency.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "MPL-2.0",
  "CC0-1.0",
  "0BSD",
  "BSL-1.0",
  # Mozilla's `webpki-roots` (CA bundle for rustls) ships under this
  # permissive Linux Foundation license; vetted as compatible with our
  # personal/commercial dual-license model.
  "CDLA-Permissive-2.0",
  "LicenseRef-genATP-Personal-Use-1.0",
]
exceptions = []

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
