version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    labels: ["dependencies", "rust"]
    commit-message:
      prefix: "chore(deps)"
      include: scope
    groups:
      patch-updates:
        update-types: ["patch"]
      minor-updates:
        update-types: ["minor"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels: ["dependencies", "github-actions"]
    commit-message:
      prefix: "chore(ci)"

  - package-ecosystem: pip
    directory: "/bindings/python"
    schedule:
      interval: weekly
    labels: ["dependencies", "python"]

  - package-ecosystem: npm
    directory: "/bindings/node"
    schedule:
      interval: weekly
    labels: ["dependencies", "node"]
