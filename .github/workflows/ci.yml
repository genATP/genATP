name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RUST_BACKTRACE: 1

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----- fast lane: lint & format gate before paying for the matrix -----
  lint:
    name: lint (fmt + clippy + deny + audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy --workspace -- -D warnings
        run: cargo clippy --workspace --exclude genatp-python --all-targets -- -D warnings

      # cargo-audit before cargo-deny; deny uses ~/.cargo/deny-advisory-db (see deny.toml)
      # so it does not collide with audit's ~/.cargo/advisory-db.
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: cargo audit
        run: cargo audit --deny warnings

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: cargo deny check
        run: cargo deny check

  # ----- 5-target build/test matrix per Phase 0 acceptance criteria -----
  # macos-13 free-tier runners can queue 30+ min on weekends — timeout-minutes
  # bounds the wait so a stuck job doesn't block PR merges indefinitely.
  test:
    name: test (${{ matrix.target }})
    needs: lint
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            chrome_setup: setup-chrome
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            # browser-actions/setup-chrome@v1 does not support linux arm64 yet.
            chrome_setup: apt-chromium
          - os: macos-13
            target: x86_64-apple-darwin
            chrome_setup: setup-chrome
          - os: macos-14
            target: aarch64-apple-darwin
            chrome_setup: setup-chrome
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            chrome_setup: setup-chrome
    runs-on: ${{ matrix.os }}
    env:
      # Browser integration tests honor CHROME_PATH; setup-chrome exports it.
      GENATP_TEST_HEADLESS: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Setup Chrome (setup-chrome action)
        if: matrix.chrome_setup == 'setup-chrome'
        uses: browser-actions/setup-chrome@v1
        id: setup-chrome
        with:
          chrome-version: stable

      - name: Setup Chromium (apt — Linux ARM64)
        if: matrix.chrome_setup == 'apt-chromium'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y chromium-browser chromium-chromedriver \
            || sudo apt-get install -y chromium
          CHROME="$(command -v chromium-browser || command -v chromium || true)"
          if [ -z "$CHROME" ]; then
            echo "No chromium binary found after apt install" >&2
            exit 1
          fi
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
          echo "Installed Chromium at $CHROME"

      - name: Export CHROME_PATH (unix, setup-chrome)
        if: runner.os != 'Windows' && matrix.chrome_setup == 'setup-chrome'
        run: echo "CHROME_PATH=${{ steps.setup-chrome.outputs.chrome-path }}" >> $GITHUB_ENV

      - name: Export CHROME_PATH (windows)
        if: runner.os == 'Windows'
        run: echo "CHROME_PATH=${{ steps.setup-chrome.outputs.chrome-path }}" >> $env:GITHUB_ENV

      - name: cargo build --workspace
        run: cargo build --workspace --exclude genatp-python --target ${{ matrix.target }} --verbose

      - name: cargo test --workspace
        run: cargo test --workspace --exclude genatp-python --target ${{ matrix.target }} --verbose

  # ----- coverage (one target only — codecov ratchet ≥ 70% workspace) -----
  coverage:
    name: coverage (linux)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Generate coverage
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info

      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # ----- aggregate gate — branch protection points at this single check -----
  ci:
    name: ci
    needs: [lint, test, coverage]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All checks passed
        if: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
        run: echo "CI green"
      - name: Failure
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "One or more required jobs failed:"
          echo "  lint=${{ needs.lint.result }}"
          echo "  test=${{ needs.test.result }}"
          echo "  coverage=${{ needs.coverage.result }}"
          exit 1
