name: Nightly Stealth Suite

# Runs the anti-bot stealth suite against external bot-detection sites nightly.
# Quarantine model: stealth tests live outside the PR-blocking matrix so a
# vendor changing their fingerprint at 3am doesn't stop releases. A failure
# opens a P1 ticket via the action below.
#
# Phase 0 ships the schedule + skeleton. Real stealth probes land in Phase 11
# (anti-bot hardening) which adds the suite to fixtures/stealth/.

on:
  schedule:
    - cron: "17 3 * * *"  # 03:17 UTC daily
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  CARGO_TERM_COLOR: always

jobs:
  stealth:
    name: stealth probes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: stealth

      - name: Detect stealth suite
        id: detect
        shell: bash
        run: |
          if [ -d fixtures/stealth ]; then
            echo "has_stealth=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_stealth=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run stealth probes
        if: steps.detect.outputs.has_stealth == 'true'
        run: cargo test -p genatp-browser --features stealth-suite -- --ignored --test-threads 1
        env:
          GENATP_STEALTH_LIVE: "1"

      - name: Open issue on failure
        if: failure() && steps.detect.outputs.has_stealth == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[stealth] nightly probe failed ${new Date().toISOString().slice(0,10)}`,
              labels: ["stealth", "P1", "auto-opened"],
              body: `Nightly stealth suite failed.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nQuarantined from PR matrix per Phase 11 policy. Triage within 24h.`
            });

      - name: No-op (Phase 0 — stealth suite not yet authored)
        if: steps.detect.outputs.has_stealth != 'true'
        run: echo "Stealth suite not present. Phase 11 will populate fixtures/stealth/."
