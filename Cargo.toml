[workspace]
resolver = "2"
members = [
  "crates/genatp-core",
  "crates/genatp-browser",
  "crates/genatp-perception",
  "crates/genatp-vault",
  "crates/genatp-cassette",
  "crates/genatp-atp-spec",
  "crates/genatp-mcp",
  "crates/genatp-llm",
  "crates/genatp-cli",
  "crates/genatp-registry",
  "crates/genatp-debugger",
  "bindings/python",
  "bindings/node",
]

# Default members exclude bindings; CI runs them in dedicated jobs that
# install Python / Node toolchains. `cargo test/build --workspace` pass
# `--exclude genatp-python` (PyO3 cdylib); pytest + maturin cover the SDK.
default-members = [
  "crates/genatp-core",
  "crates/genatp-browser",
  "crates/genatp-perception",
  "crates/genatp-vault",
  "crates/genatp-cassette",
  "crates/genatp-atp-spec",
  "crates/genatp-mcp",
  "crates/genatp-llm",
  "crates/genatp-cli",
  "crates/genatp-registry",
  "crates/genatp-debugger",
]

[workspace.package]
version = "0.3.0"
authors = ["genATP contributors"]
edition = "2024"
rust-version = "1.95"
license = "LicenseRef-genATP-Personal-Use-1.0"
repository = "https://github.com/genatp/genatp"
homepage = "https://genatp.dev"
publish = false
readme = "../../README.md"

[workspace.lints.clippy]
# Phase 0 keeps the lint floor at clippy::all. Crates ratchet to pedantic
# individually as they mature (per phase exit criteria).
all = { level = "warn", priority = -1 }

[workspace.dependencies]
# Shared dependency versions. Crates opt in via `dep.workspace = true`.
# Pinned conservatively; bump deliberately, not opportunistically.
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-util = "0.3"
url = "2"
chromiumoxide = { version = "0.9", default-features = false, features = [
  "rustls",
  "zip8",
] }
# Phase 2 — perception
blake3 = "1"
hex = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
zstd = "0.13"
async-trait = "0.1"
# Phase 3 — LLM clients + orchestrator
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
  "stream",
  "gzip",
] }
fastrand = "2"
futures = "0.3"
chrono = { version = "0.4", default-features = false, features = [
  "clock",
  "serde",
] }
# Phase 4 — MCP server v0.1
clap = { version = "4", features = ["derive", "env"] }
base64 = "0.22"
# Phase 6 — Auth Vault
# Crypto stack pinned to RustCrypto's audited family. We do NOT mix in
# `ring` here on purpose — fewer audit surfaces, all pure-Rust, plays
# nicely with `forbid(unsafe_code)`.
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
argon2 = "0.5"
zeroize = { version = "1", features = ["derive"] }
secrecy = "0.10"
rand = "0.8"
keyring = { version = "3", default-features = false, features = [
  "apple-native",
  "windows-native",
  "linux-native",
] }
directories = "5"
# dev-only — fixture HTTP server + benchmarks + property/snapshot tests
axum = "0.8"
tower-http = { version = "0.6", features = ["trace", "cors"] }
criterion = { version = "0.7", default-features = false, features = [
  "plotters",
  "rayon",
  "async_tokio",
] }
tempfile = "3"
insta = { version = "1", features = ["json"] }
proptest = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
debug = false

[profile.dev]
opt-level = 0
debug = true

# Speed up cargo-dist / release builds without sacrificing optimization.
[profile.dist]
inherits = "release"
lto = "fat"
